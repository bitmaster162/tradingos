services:
  tradingos:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TRADINGOS_CONFIG_PATH: /runtime/config/security_config.json
      TRADINGOS_STATE_DIR: /runtime/state
    volumes:
      - ./runtime/config:/runtime/config:ro
      - tradingos_state:/runtime/state
      - ./runtime/jobs:/runtime/jobs
    ports:
      - "127.0.0.1:8787:8787"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777

volumes:
  tradingos_state:
