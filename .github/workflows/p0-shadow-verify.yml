name: P0 Shadow Verify

on:
  push:
    branches:
      - agent/p0-shadow-integration-r1
  pull_request:
    branches:
      - codex02/m2b-forward-edge-evidence

permissions:
  contents: read

jobs:
  offline-shadow-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile shadow modules through P0 release qualification R1.1
        run: |
          python -m py_compile tools/tradingos_shadow_integration.py tools/unified_shadow_temporal_anchor.py tools/unified_shadow_history_replay.py tools/unified_shadow_domain_subjects.py tools/unified_shadow_domain_history_closure.py tools/unified_shadow_human_custody.py tools/unified_shadow_human_asymmetric_custody.py tools/unified_shadow_human_asymmetric_custody_v2.py tools/unified_shadow_human_gate_consume.py tools/unified_shadow_writer_fencing_recovery.py tools/unified_shadow_writer_fencing_recovery_v2.py tools/unified_shadow_dual_state_atomicity.py tools/p0_release_qualification.py tools/p0_release_qualification_r1_1.py tools/unified_shadow_federation.py tools/unified_shadow_router.py tools/unified_shadow_control_plane.py tools/unified_shadow_transaction.py tools/unified_shadow_closure.py tools/unified_shadow_research_plane.py tools/unified_shadow_research_closure.py tools/unified_shadow_knowledge_memory.py tools/unified_shadow_knowledge_closure.py tools/unified_shadow_capability_bus.py tools/unified_shadow_capability_closure.py tools/unified_shadow_trading_advisory.py tools/unified_shadow_advisory_closure.py tools/unified_shadow_cognition_plane.py tools/unified_shadow_cognition_closure.py tools/unified_shadow_human_interface.py tools/unified_shadow_human_interface_closure.py tools/unified_shadow_product_service.py tools/unified_shadow_parked_nontrading.py tools/unified_shadow_executor_boundary.py
      - name: Run P0 shadow integration, torture replay and release qualification R1/R1.1 tests
        run: |
          python -m unittest tests.test_tradingos_shadow_integration tests.test_unified_shadow_federation tests.test_unified_shadow_router tests.test_unified_shadow_control_plane tests.test_unified_shadow_transaction tests.test_unified_shadow_closure tests.test_unified_shadow_research_plane tests.test_unified_shadow_research_closure tests.test_unified_shadow_knowledge_memory tests.test_unified_shadow_knowledge_closure tests.test_unified_shadow_capability_bus tests.test_unified_shadow_capability_closure tests.test_unified_shadow_trading_advisory tests.test_unified_shadow_advisory_closure tests.test_unified_shadow_cognition_plane tests.test_unified_shadow_cognition_closure tests.test_unified_shadow_human_interface tests.test_unified_shadow_human_interface_closure tests.test_unified_shadow_product_service tests.test_unified_shadow_parked_nontrading tests.test_unified_shadow_executor_boundary tests.test_unified_shadow_outer_planes tests.test_p0_torture_replay tests.test_p0_torture_replay_r2 tests.test_p0_torture_replay_r3 tests.test_p0_torture_replay_r4 tests.test_p0_torture_replay_r5 tests.test_p0_torture_replay_r6 tests.test_p0_torture_replay_r6_v2 tests.test_p0_torture_replay_r7 tests.test_p0_torture_replay_r8 tests.test_p0_torture_replay_r8_v2 tests.test_p0_torture_replay_r9 tests.test_p0_release_qualification tests.test_p0_release_qualification_r1_1 -v
