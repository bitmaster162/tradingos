name: R101 Full Basket Coverage
on:
  push:
    branches: [agent/r101-full-basket-coverage-r1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify bounded stacked baseline
        shell: bash
        run: |
          set -euo pipefail
          base=4d99edaed96cf5cfe7783c2cd00f96bee452bb45
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --check "$base" HEAD
          python - <<'PY'
          import subprocess
          allowed={
            'tools/relative_strength_rotation_nested_holdout.py',
            'tools/session_volatility_compression_breakout_nested_holdout.py',
            'tests/test_r101_full_basket_coverage.py',
            'docs/R101_FULL_BASKET_COVERAGE.md',
            '.github/workflows/r101_full_basket_coverage.yml',
          }
          changed=set(subprocess.check_output(['git','diff','--name-only',
            '4d99edaed96cf5cfe7783c2cd00f96bee452bb45','HEAD'],text=True).splitlines())
          assert changed <= allowed, sorted(changed-allowed)
          PY
      - name: Compile changed research tools
        run: |
          python -m py_compile             tools/relative_strength_rotation_nested_holdout.py             tools/session_volatility_compression_breakout_nested_holdout.py
      - name: Full basket coverage regressions
        run: python -B -m unittest tests.test_r101_full_basket_coverage -v
      - name: Preserve R98-R100 protocol regressions
        run: |
          python -B -m unittest tests.test_nested_oos_open_once -v
          python -B -m unittest tests.test_time_fold_block_bootstrap -v
          python -B -m unittest tests.test_r100_gap_censor_hold -v
