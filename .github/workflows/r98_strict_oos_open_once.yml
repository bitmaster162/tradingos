name: R98 Strict OOS Open Once
on:
  push:
    branches: [agent/r98-strict-oos-open-once-r1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify exact bounded baseline
        shell: bash
        run: |
          set -euo pipefail
          base=f4ccbe4228dc7aa59a0d36f41bab45b5f0a1dce6
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --check "$base" HEAD
          python - <<'PY'
          import subprocess
          allowed={
            'tools/relative_strength_rotation_nested_holdout.py',
            'tools/session_volatility_compression_breakout_nested_holdout.py',
            'tests/test_nested_oos_open_once.py',
            'docs/R98_STRICT_OOS_OPEN_ONCE.md',
            '.github/workflows/r98_strict_oos_open_once.yml',
          }
          changed=set(subprocess.check_output(['git','diff','--name-only',
            'f4ccbe4228dc7aa59a0d36f41bab45b5f0a1dce6','HEAD'],text=True).splitlines())
          assert changed <= allowed, sorted(changed-allowed)
          PY
      - name: Compile patched tools
        run: |
          python -m py_compile             tools/relative_strength_rotation_nested_holdout.py             tools/session_volatility_compression_breakout_nested_holdout.py
      - name: OOS-open-once behavioral regressions
        run: python -B -m unittest tests.test_nested_oos_open_once -v
