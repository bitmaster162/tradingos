name: R101 Fixed Basket Availability
on:
  push:
    branches: [agent/r101-fixed-basket-availability-r1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify bounded stacked baseline
        shell: bash
        run: |
          set -euo pipefail
          base=b684f4cd12a93adf7d4b5da8137c4a2400b86d61
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --check "$base" HEAD
          python - <<'PY'
          import subprocess
          allowed={
            'tools/relative_strength_rotation_nested_holdout.py',
            'tests/test_fixed_basket_availability.py',
            'docs/R101_FIXED_BASKET_AVAILABILITY.md',
            '.github/workflows/r101_fixed_basket_availability.yml',
          }
          changed=set(subprocess.check_output(['git','diff','--name-only',
            'b684f4cd12a93adf7d4b5da8137c4a2400b86d61','HEAD'],text=True).splitlines())
          assert changed <= allowed, sorted(changed-allowed)
          PY
      - name: Compile patched tool
        run: python -m py_compile tools/relative_strength_rotation_nested_holdout.py
      - name: Fixed basket availability regressions
        run: python -B -m unittest tests.test_fixed_basket_availability -v
      - name: Preserve R100 through R98 regressions
        run: |
          python -B -m unittest tests.test_fold_lifecycle_boundaries -v
          python -B -m unittest tests.test_time_fold_block_bootstrap -v
          python -B -m unittest tests.test_nested_oos_open_once -v
