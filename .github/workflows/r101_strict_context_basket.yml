name: R101 Strict Context Basket
on:
  push:
    branches: [agent/r101-strict-context-basket-r1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify exact R99 bounded scope
        shell: bash
        run: |
          set -euo pipefail
          base=11e78012786b5d18816f4c7cde17ef734d18c53c
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --check "$base" HEAD
          python - <<'PY'
          import subprocess
          allowed={
            'tools/relative_strength_rotation_nested_holdout.py',
            'tests/test_r101_context_basket.py',
            'docs/R101_STRICT_CONTEXT_BASKET.md',
            '.github/workflows/r101_strict_context_basket.yml',
          }
          changed=set(subprocess.check_output(['git','diff','--name-only',
            '11e78012786b5d18816f4c7cde17ef734d18c53c','HEAD'],text=True).splitlines())
          assert changed <= allowed, sorted(changed-allowed)
          PY
      - name: Compile patched tool
        run: python -m py_compile tools/relative_strength_rotation_nested_holdout.py
      - name: Strict context basket regressions
        run: python -B -m unittest tests.test_r101_context_basket -v
