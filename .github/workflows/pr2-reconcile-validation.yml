name: PR2 reconciliation validation

on:
  push:
    branches:
      - chatgpt/pr2-reconcile-validation-r1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest

      - name: Verify reconciliation identity and safety invariants
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(git rev-list --first-parent HEAD | grep -m1 '^4dcc9a03410a75d545840183f219569b17bd8e3c$')"
          test "$SOURCE_COMMIT" = "4dcc9a03410a75d545840183f219569b17bd8e3c"
          test "$(git rev-parse 4dcc9a03410a75d545840183f219569b17bd8e3c^{tree})" = "1dd82188be29d944158c7aedb22ddac156620d1e"
          test "$(git hash-object tools/tradingos_decision_brief_v2.py)" = "0aaa37a74ffa85ae6b52ecc821acbc46b5d521d0"
          test ! -e deploy/.env
          grep -Fx 'TRADINGOS_LIVE_SEND_ENABLED=0' deploy/.env.example
          python - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path('deploy/security_config.template.json').read_text())
          assert cfg['mode'] == 'DISABLED', cfg
          assert cfg['deploy_permission'] == 'DENY', cfg
          PY

      - name: Python compile
        run: python -m compileall -q tools scripts tests

      - name: Fresh TradingOS test suite
        shell: bash
        run: python -m pytest -q tests/test_tradingos_*.py

      - name: Compose parse
        shell: bash
        run: docker compose -f deploy/docker-compose.yml config --quiet
